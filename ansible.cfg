[defaults]
interpreter_python	= auto_silent
ansible_managed		= "WARNING: This file is managed with Ansible, see https://github.com/Daenou/ansible-multiroom-audio"
display_skipped_hosts	= false
# warning: This setting makes you lose the standard setting which includes
# /.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
roles_path              = ./roles:~/.ansible/roles
